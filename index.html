<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Feedback - J3 Padel</title>
  <style>
    :root{--bg:#050505;--surface:#0f0f0f;--surface2:#1a1a1a;--border:rgba(255,255,255,0.08);--text:#fff;--text2:rgba(255,255,255,0.55);--text3:rgba(255,255,255,0.3);--accent:#818cf8;--success:#4ade80;--gold:#eab308}
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--text);font-family:-apple-system,sans-serif;min-height:100vh}
    .c{max-width:480px;margin:0 auto;padding:20px}
    .h{display:flex;align-items:center;gap:12px;margin-bottom:24px}
    .logo{width:44px;height:44px;background:var(--accent);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900}
    .h h1{font-size:18px;font-weight:800}
    .h p{font-size:12px;color:var(--text2)}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:16px}
    .card.match{border-color:rgba(74,222,128,0.2)}
    .ch{display:flex;align-items:center;gap:14px;margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--border)}
    .ci{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;background:rgba(74,222,128,0.12)}
    .ct{font-size:15px;font-weight:700}
    .cs{font-size:12px;color:var(--text2);margin-top:2px}
    .dr{font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:8px}
    .section{margin-bottom:24px}
    .section-title{font-size:11px;font-weight:800;letter-spacing:0.1em;text-transform:uppercase;color:var(--text3);margin-bottom:12px;display:flex;align-items:center;gap:8px}
    .section-title .icon{font-size:14px}
    .pilar{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px}
    .pilar-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
    .pilar-name{font-size:14px;font-weight:700}
    .rating{display:flex;gap:6px}
    .rating-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);font-size:13px;font-weight:700;cursor:pointer;transition:all 0.2s}
    .rating-btn:hover{border-color:var(--accent);color:var(--text)}
    .rating-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
    textarea{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;padding:12px;outline:none;font-family:inherit;resize:none;min-height:80px;line-height:1.5}
    textarea:focus{border-color:var(--accent)}
    textarea::placeholder{color:var(--text3)}
    .fl{font-size:11px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;color:var(--text3);margin-bottom:8px;display:block}
    input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:12px;color:var(--text);font-size:16px;padding:14px;outline:none;font-family:inherit;margin-bottom:16px}
    input:focus{border-color:var(--accent)}
    input::placeholder{color:var(--text3)}
    button{width:100%;padding:16px;background:var(--text);color:var(--bg);border:none;border-radius:12px;font-size:15px;font-weight:800;cursor:pointer;margin-top:8px}
    button:disabled{opacity:0.5}
    .done{text-align:center;padding:60px 20px}
    .di{width:72px;height:72px;background:rgba(74,222,128,0.12);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 24px;font-size:32px;color:var(--success)}
    .done h2{font-size:22px;font-weight:800;margin-bottom:8px}
    .done p{font-size:14px;color:var(--text2)}
    .ld,.er{text-align:center;padding:60px 20px}
    .ld{color:var(--text2)}
    .er{color:#f87171}
    .partner-section{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px}
    .partner-section h3{font-size:13px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
    .partner-section h3 .emoji{font-size:16px}
  </style>
</head>
<body>
  <div class="c">
    <div class="h"><div class="logo">J3</div><div><h1>Feedback</h1><p id="subtitle">Ayuda a mejorar a tu jugador</p></div></div>
    <div id="ld" class="ld">Cargando...</div>
    <div id="er" class="er" style="display:none"></div>
    <div id="ct" style="display:none"></div>
  </div>
  <script>
    const API='https://pikabkeebxedskogaaac.supabase.co/functions/v1/training-feedback-api';
    const P=new URLSearchParams(location.search);
    const T=P.get('token');
    let DATA=null;
    
    async function L(){
      if(!T){E('Token no proporcionado');return}
      try{
        const r=await fetch(API+'?token='+T);
        const d=await r.json();
        if(d.error)return E(d.error);
        DATA=d;
        if(d.alreadyDone){showDone();return}
        if(d.recipient_type==='partner'){renderPartnerForm(d)}
        else{renderCoachForm(d)}
      }catch(e){E('Error al cargar: '+e.message)}
    }
    
    function E(m){document.getElementById('ld').style.display='none';document.getElementById('er').style.display='block';document.getElementById('er').textContent=m}
    function showDone(){document.getElementById('ld').style.display='none';document.getElementById('ct').style.display='block';document.getElementById('ct').innerHTML='<div class="done"><div class="di">✓</div><h2>Feedback enviado</h2><p>Gracias por tu valoracion.</p></div>'}
    
    function renderCoachForm(d){
      document.getElementById('ld').style.display='none';
      document.getElementById('subtitle').textContent='Evaluacion como coach';
      const c=document.getElementById('ct');c.style.display='block';
      const ctx=d.match?.contexto||d.training||{};
      const isMatch=d.type!=='training';
      
      let matchInfo='';
      if(isMatch){
        const res=ctx.resultado==='win'?'🏆 Victoria':'❌ Derrota';
        matchInfo=`<div class="card match"><div class="ch"><div class="ci">🎾</div><div><div class="ct">${d.type==='torneo'?'Partido de torneo':'Partido amistoso'}</div><div class="cs">${ctx.marcador||''}</div></div></div>`;
        if(ctx.resultado)matchInfo+=`<div class="dr"><strong>Resultado:</strong> ${res}</div>`;
        if(ctx.companero)matchInfo+=`<div class="dr"><strong>Companero:</strong> ${ctx.companero}</div>`;
        if(ctx.rivales)matchInfo+=`<div class="dr"><strong>Rivales:</strong> ${ctx.rivales}</div>`;
        matchInfo+='</div>';
      }
      
      c.innerHTML=`
        ${matchInfo}
        <form id="fm">
          <label class="fl">Tu nombre</label>
          <input id="nm" placeholder="Nombre" required>
          
          <div class="section">
            <div class="section-title"><span class="icon">🎯</span> EVALUACION POR PILARES</div>
            
            <div class="pilar">
              <div class="pilar-header">
                <span class="pilar-name">Tecnico</span>
                <div class="rating" data-field="tecnico">${ratingBtns('tecnico')}</div>
              </div>
              <textarea id="com_tecnico" placeholder="Golpes, tecnica, ejecucion..."></textarea>
            </div>
            
            <div class="pilar">
              <div class="pilar-header">
                <span class="pilar-name">Tactico</span>
                <div class="rating" data-field="tactico">${ratingBtns('tactico')}</div>
              </div>
              <textarea id="com_tactico" placeholder="Lectura de juego, decisiones, estrategia..."></textarea>
            </div>
            
            <div class="pilar">
              <div class="pilar-header">
                <span class="pilar-name">Fisico</span>
                <div class="rating" data-field="fisico">${ratingBtns('fisico')}</div>
              </div>
              <textarea id="com_fisico" placeholder="Movimiento, resistencia, velocidad..."></textarea>
            </div>
            
            <div class="pilar">
              <div class="pilar-header">
                <span class="pilar-name">Mental</span>
                <div class="rating" data-field="mental">${ratingBtns('mental')}</div>
              </div>
              <textarea id="com_mental" placeholder="Gestion de presion, actitud, concentracion..."></textarea>
            </div>
          </div>
          
          <div class="section">
            <div class="section-title"><span class="icon">💬</span> COMENTARIOS GENERALES</div>
            <textarea id="com_general" placeholder="Observaciones adicionales, recomendaciones..." style="min-height:100px"></textarea>
          </div>
          
          <button type="submit" id="bt">Enviar feedback</button>
        </form>
      `;
      
      initRatings();
      document.getElementById('fm').onsubmit=submitCoach;
    }
    
    function renderPartnerForm(d){
      document.getElementById('ld').style.display='none';
      document.getElementById('subtitle').textContent='Feedback de companero';
      const c=document.getElementById('ct');c.style.display='block';
      const ctx=d.match?.contexto||{};
      const rivales=(ctx.rivales||'').split('/').map(r=>r.trim()).filter(Boolean);
      
      c.innerHTML=`
        <div class="card match">
          <div class="ch"><div class="ci">🎾</div><div><div class="ct">Partido</div><div class="cs">${ctx.marcador||''} ${ctx.resultado==='win'?'- Victoria':'- Derrota'}</div></div></div>
        </div>
        
        <form id="fm">
          <label class="fl">Tu nombre</label>
          <input id="nm" placeholder="Nombre" required>
          
          <div class="partner-section">
            <h3><span class="emoji">🙋</span> Sobre tu companero</h3>
            <textarea id="com_jugador" placeholder="Como jugo? Que hizo bien? Que puede mejorar?"></textarea>
          </div>
          
          <div class="partner-section">
            <h3><span class="emoji">⚔️</span> Sobre los rivales</h3>
            ${rivales.length>=1?`<label class="fl">${rivales[0]||'Rival 1'}</label><input id="r1_nombre" value="${rivales[0]||''}" placeholder="Nombre rival 1"><textarea id="r1_feedback" placeholder="Como jugaba? Debilidades? Fortalezas?"></textarea>`:''}
            ${rivales.length>=2||rivales.length===0?`<label class="fl" style="margin-top:12px">${rivales[1]||'Rival 2'}</label><input id="r2_nombre" value="${rivales[1]||''}" placeholder="Nombre rival 2"><textarea id="r2_feedback" placeholder="Como jugaba? Debilidades? Fortalezas?"></textarea>`:''}
          </div>
          
          <div class="partner-section">
            <h3><span class="emoji">🤝</span> Sobre el partido</h3>
            <textarea id="com_pareja" placeholder="Que funciono como pareja? Que no? Comunicacion?"></textarea>
          </div>
          
          <button type="submit" id="bt">Enviar feedback</button>
        </form>
      `;
      
      document.getElementById('fm').onsubmit=submitPartner;
    }
    
    function ratingBtns(field){
      return [1,2,3,4,5].map(n=>`<button type="button" class="rating-btn" data-field="${field}" data-value="${n}">${n}</button>`).join('');
    }
    
    const ratings={tecnico:null,tactico:null,fisico:null,mental:null};
    
    function initRatings(){
      document.querySelectorAll('.rating-btn').forEach(btn=>{
        btn.onclick=()=>{
          const field=btn.dataset.field;
          const value=parseInt(btn.dataset.value);
          ratings[field]=value;
          document.querySelectorAll(`.rating-btn[data-field="${field}"]`).forEach(b=>b.classList.remove('active'));
          btn.classList.add('active');
        };
      });
    }
    
    async function submitCoach(e){
      e.preventDefault();
      const b=document.getElementById('bt');b.disabled=true;b.textContent='Enviando...';
      try{
        const body={
          feedbackType:'coach',
          nombre:document.getElementById('nm').value,
          rating_tecnico:ratings.tecnico,
          comentario_tecnico:document.getElementById('com_tecnico').value,
          rating_tactico:ratings.tactico,
          comentario_tactico:document.getElementById('com_tactico').value,
          rating_fisico:ratings.fisico,
          comentario_fisico:document.getElementById('com_fisico').value,
          rating_mental:ratings.mental,
          comentario_mental:document.getElementById('com_mental').value,
          comentario_general:document.getElementById('com_general').value
        };
        const r=await fetch(API+'?token='+T,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
        const d=await r.json();
        if(d.success){showDone()}else{alert(d.error||'Error');b.disabled=false;b.textContent='Enviar feedback'}
      }catch(x){alert('Error');b.disabled=false;b.textContent='Enviar feedback'}
    }
    
    async function submitPartner(e){
      e.preventDefault();
      const b=document.getElementById('bt');b.disabled=true;b.textContent='Enviando...';
      try{
        const body={
          feedbackType:'partner',
          nombre:document.getElementById('nm').value,
          comentario_jugador:document.getElementById('com_jugador')?.value||'',
          rival1_nombre:document.getElementById('r1_nombre')?.value||'',
          rival1_feedback:document.getElementById('r1_feedback')?.value||'',
          rival2_nombre:document.getElementById('r2_nombre')?.value||'',
          rival2_feedback:document.getElementById('r2_feedback')?.value||'',
          comentario_pareja:document.getElementById('com_pareja')?.value||''
        };
        const r=await fetch(API+'?token='+T,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
        const d=await r.json();
        if(d.success){showDone()}else{alert(d.error||'Error');b.disabled=false;b.textContent='Enviar feedback'}
      }catch(x){alert('Error');b.disabled=false;b.textContent='Enviar feedback'}
    }
    
    L();
  </script>
</body>
</html>
